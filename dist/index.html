  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f8f5}

</head>
<body>
  <iframe id="preview" title="OWNGROUND | 제조의 오늘과 내일을 잇습니다." src="./site-shell.html#brand-core"></iframe>
  <script>
    const preview=document.querySelector('#preview');
    preview.addEventListener('load',()=>{
      const doc=preview.contentDocument;
      const panel=doc.querySelector('#panel-d');
      const refinement=doc.createElement('style');
      refinement.textContent=`
        html{scroll-behavior:auto!important}
        /* OWNGROUND transition refinement: agency-led wordmark. */
        .d .logo .own{color:var(--green)}
        .d .logo .ground{color:var(--ink)}

        /* Narrative v0.2 / 02 FROM DATA — observation becomes field conviction. */
        .d .from-data-section{
          min-height:calc(100vh - 86px);
          padding:40px 3.5vw 48px;
          display:grid;
          grid-template-rows:auto 1fr;
          border-bottom:2px solid var(--ink);
          scroll-margin-top:0;
        }
        .d .from-data-section [data-reveal]{
          opacity:1!important;
          visibility:visible!important;
          transform:none!important;
          transition:none!important;
        }
        .d .from-data-kicker{
          display:flex;
          justify-content:space-between;
          padding-bottom:22px;
          color:var(--green);
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.13em;
          border-bottom:1px solid var(--line);
        }
        .d .from-data-content{
          min-height:0;
          display:grid;
          grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr);
          gap:7vw;
          align-items:stretch;
        }
        .d .from-data-copy{
          padding:clamp(54px,8vh,86px) 0 48px;
          display:flex;
          flex-direction:column;
        }
        .d .from-data-title{
          max-width:760px;
          margin:0;
          color:var(--ink);
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:clamp(54px,5.15vw,82px);
          font-weight:500;
          line-height:1.02;
          letter-spacing:-.065em;
          word-break:keep-all;
        }
        .d .from-data-body{
          max-width:650px;
          margin:clamp(46px,7vh,72px) 0 0;
          color:var(--muted);
          font-family:"OWNGROUND Wanted Sans",sans-serif;
          font-size:18px;
          font-weight:430;
          line-height:1.78;
          letter-spacing:-.015em;
        }
        .d .from-data-body p{margin:0 0 24px}
        .d .from-data-body p:last-child{margin-bottom:0}
        .d .from-data-outcome{
          padding:clamp(62px,10vh,106px) 0 48px 4vw;
          display:flex;
          flex-direction:column;
          justify-content:space-between;
          border-left:1px solid var(--line);
        }
        .d .from-data-flow{height:clamp(290px,38vh,350px);position:relative}
        .d .evidence-layers{position:absolute;inset:0}
        .d .evidence-depth-guide{
          width:7%;
          height:calc(57% + 10px);
          position:absolute;
          left:13%;
          top:calc(15% + 39px);
          border-left:1px solid rgba(137,154,145,.38);
          border-bottom:1px solid rgba(137,154,145,.38);
          transform:skewX(12deg);
          transform-origin:bottom left;
        }
        .d .evidence-layer{position:absolute;height:54px}
        .d .evidence-layer-data{left:8%;right:22%;top:15%}
        .d .evidence-layer-operation{left:15%;right:12%;top:45%}
        .d .evidence-layer-field{left:23%;right:1%;top:72%}
        .d .evidence-line{
          height:1px;
          position:absolute;
          left:0;
          right:0;
          bottom:0;
          background:rgba(137,154,145,.5);
          transform-origin:left center;
        }
        .d .evidence-layer-operation .evidence-line{background:rgba(96,118,106,.74)}
        .d .evidence-layer-field .evidence-line{height:2px;background:var(--green)}
        .d .evidence-node{
          width:8px;
          height:8px;
          position:absolute;
          left:-4px;
          bottom:-3.5px;
          z-index:1;
          background:var(--paper);
          border:1px solid rgba(96,118,106,.58);
          border-radius:50%;
        }
        .d .evidence-layer-operation .evidence-node{border-color:rgba(96,118,106,.86)}
        .d .evidence-layer-field .evidence-node{border-color:var(--green);border-width:1.5px}
        .d .evidence-layer b{
          position:absolute;
          left:20px;
          bottom:12px;
          color:rgba(82,97,88,.66);
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:20px;
          font-weight:580;
          line-height:1;
          letter-spacing:.08em;
        }
        .d .evidence-layer-operation b{color:rgba(42,58,49,.84);font-size:24px}
        .d .evidence-layer-field b{color:var(--ink);font-size:34px;font-weight:620}
        .d .evidence-layer small{
          position:absolute;
          right:0;
          bottom:14px;
          color:rgba(82,97,88,.52);
          font:600 8px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.1em;
        }
        .d .evidence-layer-operation small{color:rgba(82,97,88,.7)}
        .d .evidence-layer-field small{color:var(--green)}

        /* 01 / strong but restrained: preserve the curve, lower its ambient force. */
        .d #brand-core .hero-curve{stroke-width:1.55;opacity:.84}
        .d #brand-core .hero-guide{opacity:.26}
        .d #brand-core .hero-node{stroke-width:1.65}
        .d #brand-core .hero-node-glow{opacity:.18}

        /* 03 / disconnected value: present points, no relationship lines yet. */
        .d #field-leads .philosophy-copy{min-width:0;overflow:hidden}
        .d .field-value{width:100%;min-width:0;margin:auto 0;padding:58px 0 42px}
        .d .field-value-title{
          max-width:410px;
          margin:0;
          color:var(--ink);
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:clamp(27px,2.25vw,36px);
          font-weight:520;
          line-height:1.28;
          letter-spacing:-.045em;
          word-break:keep-all;
        }
        .d .unconnected-field{height:280px;margin-top:44px;position:relative}
        .d .unconnected-node{
          --node-stroke-color:rgba(96,118,106,var(--alpha,.62));
          width:var(--size);
          height:var(--size);
          position:absolute;
          left:var(--x);
          top:var(--y);
          border:0;
          border-radius:50%;
          background:transparent;
          box-shadow:inset 0 0 0 var(--outline) var(--node-stroke-color);
        }
        .d .unconnected-node.signal{--node-opacity:.9!important;--node-stroke-color:var(--green)}
        .d{
          --value-node-fg-size:clamp(22.5469px,1.7622vw,25.375px);
          --value-node-mid-size:clamp(17.2031px,1.3433vw,19.3438px);
          --value-node-bg-size:clamp(11.8438px,.9245vw,13.3125px);
          --value-node-fg-outline:clamp(1.6496px,.1289vw,1.8559px);
          --value-node-mid-outline:clamp(1.4344px,.1121vw,1.6138px);
          --value-node-bg-outline:clamp(1.291px,.1009vw,1.4524px);
        }
        .d .unconnected-node.depth-bg{--size:var(--value-node-bg-size);--outline:var(--value-node-bg-outline);--depth-blur:1.1px;--motion-blur:1.4px;--node-opacity:.46;--rise:18px;--settle:-2px;--peak-scale:1.012;--node-duration:680ms;opacity:.46;filter:blur(var(--depth-blur))}
        .d .unconnected-node.depth-mid{--size:var(--value-node-mid-size);--outline:var(--value-node-mid-outline);--depth-blur:.6px;--motion-blur:1px;--node-opacity:.72;--rise:23px;--settle:-3px;--peak-scale:1.015;--node-duration:760ms;opacity:.72;filter:blur(var(--depth-blur))}
        .d .unconnected-node.depth-fg{--size:var(--value-node-fg-size);--outline:var(--value-node-fg-outline);--depth-blur:0px;--motion-blur:.6px;--node-opacity:.92;--rise:28px;--settle:-4px;--peak-scale:1.015;--node-duration:840ms;opacity:.92;filter:blur(var(--depth-blur))}
        .d .field-value-meta{
          padding-top:20px;
          display:flex;
          justify-content:space-between;
          color:rgba(82,97,88,.68);
          font:600 9px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.1em;
          border-top:1px solid var(--line);
        }
        .d .field-value-meta span:first-child{color:var(--green)}

        .d .motion-ready .unconnected-node{
          opacity:0;
          transform:translateY(var(--rise)) scale(.94);
          filter:blur(calc(var(--depth-blur) + var(--motion-blur)));
        }
        .d .motion-ready .unconnected-node.group-1{--node-delay:520ms}
        .d .motion-ready .unconnected-node.group-2{--node-delay:630ms}
        .d .motion-ready .unconnected-node.group-3{--node-delay:740ms}
        .d .motion-ready .unconnected-node.group-4{--node-delay:850ms}
        .d .motion-ready .unconnected-node.group-5{--node-delay:960ms}
        .d .motion-ready.motion-active .unconnected-node{
          animation:value-node-rise var(--node-duration) cubic-bezier(.18,.7,.22,1) var(--node-delay) both;
        }
        .d .motion-reset [data-motion],
        .d .motion-reset .motion-line,
        .d .motion-reset .motion-node,
        .d .motion-reset .flow-line-motion,
        .d .motion-reset .unconnected-node{
          transition:none!important;
          animation:none!important;
        }
        @keyframes value-node-rise{
          0%{opacity:0;transform:translateY(var(--rise)) scale(.94);filter:blur(calc(var(--depth-blur) + var(--motion-blur)))}
          72%{opacity:var(--node-opacity);transform:translateY(var(--settle)) scale(var(--peak-scale));filter:blur(var(--depth-blur))}
          100%{opacity:var(--node-opacity);transform:translateY(0) scale(1);filter:blur(var(--depth-blur))}
        }
        .d .from-data-conclusion{padding-top:60px;border-top:1px solid var(--line)}
        .d .from-data-conclusion small{
          display:block;
          margin-bottom:22px;
          color:var(--green);
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.13em;
        }
        .d .from-data-conclusion strong{
          display:block;
          color:var(--ink);
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:clamp(34px,3vw,48px);
          font-weight:520;
          line-height:1.12;
          letter-spacing:-.055em;
          word-break:keep-all;
        }

        /* Narrative v0.2 navigation: six-step journey and quiet active signals. */
        @media(min-width:901px){
          .d .site-head nav{align-self:stretch}
          .d .site-head nav a{
            min-width:0;
            padding:0 clamp(13px,1.25vw,20px);
            position:relative;
            display:flex;
            align-items:center;
            color:var(--muted);
            font-size:11px;
            white-space:nowrap;
            transition:color .18s ease;
          }
          .d .site-head nav a:after{
            content:"";
            height:2px;
            position:absolute;
            left:clamp(13px,1.25vw,20px);
            right:clamp(13px,1.25vw,20px);
            bottom:-2px;
            background:var(--green);
            opacity:0;
            transform:scaleX(.35);
            transform-origin:left;
            transition:opacity .18s ease,transform .22s ease;
          }
          .d .site-head nav a[aria-current="page"]{color:var(--ink)}
          .d .site-head nav a[aria-current="page"]:after{opacity:1;transform:scaleX(1)}
          .d .site-head nav a:hover,.d .site-head nav a:focus-visible{color:var(--ink);outline:0}
        }
        .d .position-nav a{width:34px}
        .d .position-nav a:before{
          width:6px;
          transition:width .22s cubic-bezier(.2,.7,.2,1),background-color .18s ease,opacity .18s ease;
        }
        .d .position-nav a[data-distance="2"]:before{width:9px}
        .d .position-nav a[data-distance="1"]:before{width:15px}
        .d .position-nav a[data-distance="0"]:before{width:24px;height:3px;background:var(--green);opacity:1}
        .d .position-nav a:not([data-distance="0"]):hover:before,
        .d .position-nav a:not([data-distance="0"]):focus-visible:before{width:18px;opacity:.9}
        .d .locale-control{position:relative;padding:0!important;overflow:visible!important;background:transparent!important}
        .d .locale-switch{
          width:100%;height:100%;min-width:92px;padding:0 18px;border:0;background:transparent;
          display:flex;align-items:center;justify-content:center;gap:9px;
          color:var(--green);cursor:pointer;
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;letter-spacing:.11em;
        }
        .d .locale-switch:after{content:"+";color:var(--muted);font-size:12px;transition:transform .18s ease}
        .d .locale-switch[aria-expanded="true"]:after{transform:rotate(45deg)}
        .d .locale-switch:hover,.d .locale-switch:focus-visible{color:var(--ink);outline:0}
        .d .locale-menu{
          position:absolute;top:calc(100% + 1px);right:0;z-index:120;width:216px;
          display:grid;grid-template-columns:repeat(3,1fr);
          background:var(--paper);border:1px solid var(--ink);
        }
        .d .locale-menu[hidden]{display:none}
        .d .locale-menu button{
          min-height:44px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
          background:transparent;color:var(--muted);cursor:pointer;
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;letter-spacing:.1em;
        }
        .d .locale-menu button:nth-child(3n){border-right:0}
        .d .locale-menu button:last-child{border-bottom:0}
        .d .locale-menu button:hover,.d .locale-menu button:focus-visible{color:var(--ink);background:var(--soft);outline:0}
        .d .locale-menu button[aria-current="true"]{color:var(--green);background:var(--soft)}
        .d .logo-home{color:inherit;text-decoration:none;cursor:pointer}
        .d .logo-home:hover,.d .logo-home:focus-visible{color:inherit;outline:0}
        .d .header-contact{
          min-width:0;padding:0 clamp(10px,1.1vw,18px);
          display:flex;align-self:stretch;align-items:center;justify-content:center;
          color:var(--green);text-decoration:none;white-space:nowrap;
          font:700 9px "OWNGROUND IBM Plex Mono",monospace;letter-spacing:.035em;
          border-left:1px solid var(--line);
        }
        .d .header-contact:hover,.d .header-contact:focus-visible{color:var(--paper);background:var(--green);outline:0}
        .d.locale-latin .hero-title,
        .d.locale-latin .from-data-title,
        .d.locale-latin .from-data-body,
        .d.locale-latin .from-data-conclusion strong,
        .d.locale-latin .philosophy-title,
        .d.locale-latin .philosophy-body-inline,
        .d.locale-latin .field-value-title,
        .d.locale-latin .story-head h2,
        .d.locale-latin .gap-relation strong,
        .d.locale-latin .gap-close strong,
        .d.locale-latin .platform-head h2,
        .d.locale-latin .ecosystem-title,
        .d.locale-latin .ecosystem-role p{font-family:Inter,Arial,sans-serif}
        .d.locale-ja .hero-title,
        .d.locale-ja .from-data-title,
        .d.locale-ja .from-data-body,
        .d.locale-ja .from-data-conclusion strong,
        .d.locale-ja .philosophy-title,
        .d.locale-ja .philosophy-body-inline,
        .d.locale-ja .field-value-title,
        .d.locale-ja .story-head h2,
        .d.locale-ja .gap-relation strong,
        .d.locale-ja .gap-close strong,
        .d.locale-ja .platform-head h2,
        .d.locale-ja .ecosystem-title,
        .d.locale-ja .ecosystem-role p{word-break:normal;overflow-wrap:break-word}

        /* Four selected relationships form the environment; MOP is not a hub. */
        .d .mop-center:before{display:none}
        .d .mop-center:after{display:none}
        .d .mop-center>*{
          position:relative;
          z-index:1;
          text-shadow:none;
        }
        @media(min-width:901px){
          .d #the-platform .platform-connections{
            display:block!important;
          }
        }
        .d .mop-center strong{font-size:clamp(32px,2.5vw,38px)}
        .d .platform-line-guide{display:none}
        .d .platform-line{stroke-width:1.05;opacity:.72}
        .d .platform-line.primary{stroke-width:1.35;opacity:.9}
        .d .platform-line.secondary{stroke:#82978c;stroke-width:.85;opacity:.48}
        .d .platform-line.dotted{stroke-dasharray:2 8;opacity:.42}
        .d .platform-anchor-halo{fill:none;stroke:var(--green);stroke-width:1;opacity:.18}
        .d .platform-signal-node{fill:var(--paper);stroke:#82978c;stroke-width:1;opacity:.78}
        .d .platform-signal-node.active{fill:var(--green);stroke:var(--green);opacity:.82}
        .d #the-platform .platform-head h2{
          max-width:820px;
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:clamp(50px,5.25vw,80px);
          font-weight:500;
          line-height:.98;
          letter-spacing:-.06em;
          word-break:keep-all;
        }
        .d #the-platform .platform-name{
          margin:0 0 8px;
          padding-left:26px;
          color:var(--ink);
          font-family:Inter,Arial,sans-serif;
          font-size:clamp(18px,1.45vw,23px);
          font-weight:500;
          line-height:1.35;
          letter-spacing:-.025em;
          border-left:1px solid var(--line);
        }
        .d #the-platform .platform-safe-zone{pointer-events:none}
        .d .platform-mobile-connections{display:none}

        /* Narrative v0.2 / 06 ECOSYSTEM — one platform, four equal roles. */
        .d .ecosystem-section{
          min-height:calc(100vh - 86px);
          padding:40px 3.5vw 48px;
          display:grid;
          grid-template-rows:auto auto 1fr;
          border-bottom:2px solid var(--ink);
          scroll-margin-top:0;
        }
        .d .ecosystem-kicker{
          display:flex;
          justify-content:space-between;
          padding-bottom:22px;
          color:var(--green);
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.13em;
          border-bottom:1px solid var(--line);
        }
        .d .ecosystem-title{
          max-width:820px;
          margin:clamp(42px,6vh,66px) 0 clamp(38px,5vh,56px);
          color:var(--ink);
          font-family:"OWNGROUND SUIT",sans-serif;
          font-size:clamp(50px,5.25vw,80px);
          font-weight:500;
          line-height:.98;
          letter-spacing:-.06em;
          word-break:keep-all;
        }
        .d .ecosystem-grid{
          min-height:0;
          display:grid;
          grid-template-columns:1fr 1fr;
          border-top:1px solid var(--ink);
          border-bottom:1px solid var(--line);
        }
        .d .ecosystem-role{
          min-height:clamp(150px,19vh,190px);
          padding:clamp(24px,3vh,34px) clamp(24px,3vw,46px);
          display:grid;
          grid-template-rows:auto 1fr;
          align-content:space-between;
          gap:28px;
        }
        .d .ecosystem-role:nth-child(odd){padding-left:0;border-right:1px solid var(--line)}
        .d .ecosystem-role:nth-child(-n+2){border-bottom:1px solid var(--line)}
        .d .ecosystem-role small{
          color:var(--green);
          font:700 10px "OWNGROUND IBM Plex Mono",monospace;
          letter-spacing:.13em;
        }
        .d .ecosystem-role h3{
          margin:0;
          color:var(--ink);
          font-family:Inter,Arial,sans-serif;
          font-size:clamp(28px,2.6vw,42px);
          font-weight:500;
          line-height:1;
          letter-spacing:-.045em;
        }
        .d .ecosystem-role p{
          max-width:520px;
          margin:16px 0 0;
          color:var(--muted);
          font-family:"OWNGROUND Wanted Sans",sans-serif;
          font-size:clamp(16px,1.35vw,20px);
          font-weight:430;
          line-height:1.55;
          letter-spacing:-.018em;
          word-break:keep-all;
        }

        /* Calm / precise / progressive section motion contract. */
        .d .motion-ready [data-motion]{
          opacity:0!important;
          transform:translateY(14px)!important;
          transition:opacity .38s cubic-bezier(.2,.7,.2,1),transform .42s cubic-bezier(.2,.7,.2,1)!important;
          transition-delay:var(--motion-delay,0ms)!important;
        }

      };
      const applyLocale=locale=>{
        activeLocale=localeApi.apply(doc,panel,locale);
        document.documentElement.lang=activeLocale;
        preview.title=`OWNGROUND — ${localeApi.registry[activeLocale].name}`;
        const url=new URL(window.location.href);
        url.searchParams.set('lang',activeLocale);
        window.history.replaceState(null,'',`${url.pathname}${url.search}${url.hash}`);
        renderLocaleSwitch();
      };
      const closeLocaleMenu=()=>{
        localeMenu.hidden=true;
        localeSwitch.setAttribute('aria-expanded','false');
      };
      localeSwitch.addEventListener('click',()=>{
        const willOpen=localeMenu.hidden;
        localeMenu.hidden=!willOpen;
        localeSwitch.setAttribute('aria-expanded',String(willOpen));
      });
      localeMenu.addEventListener('click',event=>{
        const option=event.target.closest('[data-locale]');
        if(!option)return;
        applyLocale(option.dataset.locale);
        closeLocaleMenu();
      });
      doc.addEventListener('click',event=>{if(!localeControl.contains(event.target))closeLocaleMenu()});
      doc.addEventListener('keydown',event=>{if(event.key==='Escape'){closeLocaleMenu();localeSwitch.focus()}});
      applyLocale(activeLocale);
      const journeySections=[panel.querySelector('#brand-core'),fromData,panel.querySelector('#field-leads'),panel.querySelector('#the-gap'),panel.querySelector('#the-platform'),ecosystem];
      const journeyLinks=[...positionNav.querySelectorAll('a')];








      /* Motion hooks only: existing copy, layout, color and graphic structure stay intact. */
      const addMotion=(selector,delay=0)=>panel.querySelectorAll(selector).forEach((element,index)=>{
        element.dataset.motion='';
        element.style.setProperty('--motion-delay',`${delay+index*70}ms`);
      });
      const addLineMotion=(paths,start,step=36)=>paths.forEach((path,index)=>{
        path.classList.add('motion-line');
        path.setAttribute('pathLength','1');
        path.style.setProperty('--motion-delay',`${start+index*step}ms`);
      });
      let revealMaskSequence=0;
      const addDottedLineMotion=(paths,start,step=40)=>paths.forEach((path,index)=>{
        const svg=path.ownerSVGElement;
        const viewBox=svg.viewBox.baseVal;
        let defs=svg.querySelector('defs');
        if(!defs){
          defs=doc.createElementNS('http://www.w3.org/2000/svg','defs');
          svg.prepend(defs);
        }
        const mask=doc.createElementNS('http://www.w3.org/2000/svg','mask');
        const maskId=`line-reveal-${++revealMaskSequence}`;
        mask.id=maskId;
        mask.setAttribute('maskUnits','userSpaceOnUse');
        mask.setAttribute('x',String(viewBox.x-20));
        mask.setAttribute('y',String(viewBox.y-20));
        mask.setAttribute('width',String(viewBox.width+40));
        mask.setAttribute('height',String(viewBox.height+40));
        const reveal=doc.createElementNS('http://www.w3.org/2000/svg','path');
        reveal.setAttribute('d',path.getAttribute('d'));
        reveal.setAttribute('pathLength','1');
        reveal.setAttribute('fill','none');
        reveal.setAttribute('stroke','white');
        reveal.setAttribute('stroke-width','8');
        reveal.setAttribute('stroke-linecap','round');
        reveal.classList.add('motion-reveal-mask');
        reveal.style.setProperty('--motion-delay',`${start+index*step}ms`);
        mask.appendChild(reveal);
        defs.appendChild(mask);
        path.setAttribute('mask',`url(#${maskId})`);
      });
      addMotion('#brand-core .kicker,#brand-core .hero-brand,#brand-core .hero-title,#brand-core .hero-platform',0);
      addMotion('#brand-core .hero-bridge>small,#brand-core .hero-axis,#brand-core .hero-bridge-foot',180);
      panel.querySelectorAll('#brand-core svg path').forEach(path=>{path.classList.add('motion-line');path.setAttribute('pathLength','1')});
      panel.querySelectorAll('#brand-core svg circle:not(.hero-node-glow)').forEach(node=>node.classList.add('motion-node'));
      const heroPrimaryNode=panel.querySelector('#brand-core .hero-node.primary');
      heroPrimaryNode.setAttribute('r','3.5');
      addMotion('#from-data .from-data-copy',0);
      const fromDataSteps=[...panel.querySelectorAll('#from-data .evidence-layer')];
      [140,360,590].forEach((delay,index)=>{
        const step=fromDataSteps[index];
        step.dataset.motion='';
        step.style.setProperty('--motion-delay',`${delay}ms`);
        const line=step.querySelector('.evidence-line');
        line.classList.add('flow-line-motion');
        line.style.setProperty('--motion-delay',`${delay+90}ms`);
      });
      addMotion('#from-data .from-data-conclusion',760);
      addMotion('#field-leads .section-kicker',0);
      addMotion('#field-leads .philosophy-label',80);
      addMotion('#field-leads .philosophy-title',150);
      addMotion('#field-leads .philosophy-body-inline',240);
      addMotion('#field-leads .philosophy-copy>small',190);
      addMotion('#field-leads .field-value-title',300);
      addMotion('#field-leads .field-value-meta',530);
      const valueNodes=[...panel.querySelectorAll('#field-leads .unconnected-node')];
      const timedValueNodes=[
        ...valueNodes.filter(node=>node.classList.contains('depth-bg')&&!node.classList.contains('signal')),
        ...valueNodes.filter(node=>node.classList.contains('depth-mid')&&!node.classList.contains('signal')),
        ...valueNodes.filter(node=>node.classList.contains('depth-fg')&&!node.classList.contains('signal')),
        ...valueNodes.filter(node=>node.classList.contains('signal'))
      ];
      timedValueNodes.forEach((node,index)=>node.style.setProperty('--node-delay',`${420+index*42}ms`));
      addMotion('#the-gap .story-head',0);
      addMotion('#the-gap .gap-relation',110);
      addMotion('#the-gap .network-panel',360);
      addMotion('#the-gap .gap-close',1080);
      const gapLines=[...panel.querySelectorAll('#the-gap .network-line')];
      addLineMotion(gapLines.filter(path=>path.classList.contains('primary')),740,55);
      addLineMotion(gapLines.filter(path=>!path.classList.contains('primary')),850,28);
      panel.querySelectorAll('#the-gap .network-node').forEach((node,index)=>{node.classList.add('motion-node');node.style.setProperty('--motion-delay',`${980+index*24}ms`)});
      addMotion('#the-platform .platform-head',0);
      addMotion('#the-platform .platform-product',200);
      addMotion('#the-platform .mop-center',980);
      const desktopPlatformLines=[...panel.querySelectorAll('#the-platform .platform-line')];
      addLineMotion(desktopPlatformLines.filter(path=>path.classList.contains('primary')),500,42);
      addLineMotion(desktopPlatformLines.filter(path=>path.classList.contains('secondary')&&!path.classList.contains('dotted')),690,34);
      addDottedLineMotion(desktopPlatformLines.filter(path=>path.classList.contains('dotted')),760);
      const mobilePlatformLines=[...panel.querySelectorAll('#the-platform .platform-mobile-line')];
      addLineMotion(mobilePlatformLines.filter(path=>path.classList.contains('primary')),500,48);
      addDottedLineMotion(mobilePlatformLines.filter(path=>path.classList.contains('secondary')),700,48);
      panel.querySelectorAll('#the-platform .platform-line-node,#the-platform .platform-signal-node,#the-platform .platform-mobile-anchor').forEach((node,index)=>{node.classList.add('motion-node');node.style.setProperty('--motion-delay',`${850+index*26}ms`)});
      addMotion('#ecosystem .ecosystem-kicker',0);
      addMotion('#ecosystem .ecosystem-title',90);
      addMotion('#ecosystem .ecosystem-role',260);
      journeySections.forEach(section=>section.classList.add('motion-ready'));








      const motionState=new Map(journeySections.map(section=>[section,{status:'unseen',playing:false,replays:0,replayToken:0}]));
      let navigationTarget=null;
      let navigationSequence=0;
      const reducedMotion=doc.defaultView.matchMedia('(prefers-reduced-motion: reduce)');
      const replaySection=(section,source='scroll')=>{
        const state=motionState.get(section);
        if(!state)return;
        const replayToken=++state.replayToken;
        section.classList.add('motion-reset');
        section.classList.remove('motion-active');
        void section.offsetWidth;
        state.status='entered';
        state.replays+=1;
        section.dataset.motionSource=source;
        section.dataset.motionReplay=String(state.replays);
        doc.defaultView.requestAnimationFrame(()=>{
          if(state.replayToken!==replayToken)return;
          section.classList.remove('motion-reset');
          void section.offsetWidth;
          doc.defaultView.requestAnimationFrame(()=>{
            if(state.replayToken!==replayToken)return;
            section.classList.add('motion-active');
            state.playing=!reducedMotion.matches;
            doc.defaultView.setTimeout(()=>{if(state.replayToken===replayToken)state.playing=false},1500);
          });
        });
      };
      const updateMotion=(initial=false)=>{
        const headerHeight=panel.querySelector('.site-head').getBoundingClientRect().height;
        const viewportHeight=doc.defaultView.innerHeight;
        const initialProbe=headerHeight+(viewportHeight-headerHeight)*.32;
        journeySections.forEach(section=>{
          const state=motionState.get(section);
          const rect=section.getBoundingClientRect();
          const contentTop=headerHeight;
          const visible=Math.max(0,Math.min(rect.bottom,viewportHeight)-Math.max(rect.top,contentTop));
          const enterThreshold=Math.min(rect.height*.18,(viewportHeight-headerHeight)*.28);
          const fullyExited=rect.bottom<contentTop-120||rect.top>viewportHeight+120;
          if(initial){
            const ownsInitialProbe=rect.top<=initialProbe&&rect.bottom>initialProbe;
            if(ownsInitialProbe&&visible>=enterThreshold)replaySection(section,'initial');
            return;
          }
          if(fullyExited){
            if(state.status==='entered')state.status='exited';
            section.classList.remove('motion-active');
            return;
          }
          if(state.status!=='entered'&&visible>=enterThreshold&&navigationTarget!==section)replaySection(section,'scroll');
        });
      };
      const syncJourney=()=>{
        const headerHeight=panel.querySelector('.site-head').getBoundingClientRect().height;
        const probe=headerHeight+(doc.defaultView.innerHeight-headerHeight)*.32;
        const detectedIndex=journeySections.findIndex(section=>{const rect=section.getBoundingClientRect();return rect.top<=probe&&rect.bottom>probe});
        const currentIndex=detectedIndex<0?journeySections.length-1:detectedIndex;
        const current=journeySections[currentIndex];
        journeyLinks.forEach((link,index)=>{
          const distance=Math.abs(index-currentIndex);
          link.setAttribute('aria-current',String(link.hash===`#${current.id}`));
          link.dataset.distance=distance<=2?String(distance):'far';
        });
        mainNavLinks.forEach(link=>{
          if(link.hash===`#${current.id}`)link.setAttribute('aria-current','page');
          else link.removeAttribute('aria-current');
        });
      };
      let journeyFrame=0;
      doc.defaultView.addEventListener('scroll',()=>{
        if(journeyFrame)return;
        journeyFrame=doc.defaultView.requestAnimationFrame(()=>{journeyFrame=0;syncJourney();updateMotion()});
      },{passive:true});
      doc.defaultView.addEventListener('resize',()=>{syncJourney();updateMotion()});
      panel.querySelectorAll('a[href^="#"]').forEach(anchor=>{
        anchor.addEventListener('click',event=>{
          const id=anchor.getAttribute('href').slice(1);
          const target=doc.getElementById(id);
          if(!target)return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const headerHeight=panel.querySelector('.site-head').getBoundingClientRect().height;
          const sequence=++navigationSequence;
          navigationTarget=target;
          target.classList.remove('motion-active');
          const targetState=motionState.get(target);
          if(targetState)targetState.playing=false;
          doc.defaultView.scrollTo(0,Math.max(0,target.offsetTop-headerHeight));
          doc.defaultView.history.replaceState(null,'',`#${id}`);
          anchor.blur();
          syncJourney();
          const completeNavigation=()=>{
            if(sequence!==navigationSequence)return;
            const currentHeaderHeight=panel.querySelector('.site-head').getBoundingClientRect().height;
            const targetTop=target.getBoundingClientRect().top;
            const maxScroll=doc.documentElement.scrollHeight-doc.defaultView.innerHeight;
            const reachedTop=Math.abs(targetTop-currentHeaderHeight)<=2;
            const reachedPageStart=target===journeySections[0]&&doc.defaultView.scrollY<=2;
            const reachedPageEnd=doc.defaultView.scrollY>=maxScroll-2&&targetTop<=currentHeaderHeight;
            if(!reachedTop&&!reachedPageStart&&!reachedPageEnd){
              doc.defaultView.requestAnimationFrame(completeNavigation);
              return;
            }
            replaySection(target,'navigation');
            navigationTarget=null;
            syncJourney();
          };
          doc.defaultView.requestAnimationFrame(completeNavigation);
        },true);
      });
      const directTarget=doc.getElementById(window.location.hash.slice(1));
      if(directTarget){
        const headerHeight=panel.querySelector('.site-head').getBoundingClientRect().height;
        doc.defaultView.scrollTo(0,Math.max(0,directTarget.offsetTop-headerHeight));
        doc.defaultView.history.replaceState(null,'',`#${directTarget.id}`);
      }
      preview.style.visibility='visible';
      doc.defaultView.requestAnimationFrame(()=>doc.defaultView.requestAnimationFrame(()=>{
        syncJourney();
        updateMotion(true);
      }));
    },{once:true});
  </script>
</body>
</html>
